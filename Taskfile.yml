version: '3'

vars:
  BINARY: bfctl
  VERSION:
    sh: git describe --tags --always --dirty 2>/dev/null || echo 0.0.0-dev
  COMMIT:
    sh: git rev-parse --short HEAD 2>/dev/null || echo none
  DATE:
    sh: date -u +%Y-%m-%dT%H:%M:%SZ
  LDFLAGS: -X main.version={{.VERSION}} -X main.commit={{.COMMIT}} -X main.date={{.DATE}}

  # Pinned tooling versions — bump these when refreshing components.
  GOLANGCI_LINT_VERSION: v2.15.0

tasks:
  default:
    desc: Run the full verification suite
    cmds:
      - task: verify

  build:
    desc: Build bin/bfctl with version metadata
    cmds:
      - go build -trimpath -ldflags "{{.LDFLAGS}}" -o bin/{{.BINARY}} ./cmd/{{.BINARY}}

  test:
    desc: Run the unit tests
    cmds:
      - go test ./...

  vet:
    desc: Run go vet
    cmds:
      - go vet ./...

  lint:
    desc: Run the pinned golangci-lint release
    cmds:
      - go run github.com/golangci/golangci-lint/v2/cmd/golangci-lint@{{.GOLANGCI_LINT_VERSION}} run ./...

  verify:
    desc: go vet + golangci-lint + go test
    cmds:
      - task: vet
      - task: lint
      - task: test

  release:
    desc: Package bin/bfctl as dist/bfctl-<version>-<os>-<arch>.tar.gz
    deps:
      - build
    cmds:
      - mkdir -p dist
      - tar -czf dist/{{.BINARY}}-{{.VERSION}}-$(go env GOOS)-$(go env GOARCH).tar.gz -C bin {{.BINARY}}

  clean:
    desc: Remove build artifacts
    cmds:
      - rm -rf bin dist
